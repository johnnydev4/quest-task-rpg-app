<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- maximum-scale=1 evita el zoom automático de iOS al enfocar inputs (el pellizco sigue funcionando) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <!-- PWA instalada en iOS: pantalla completa y barra de estado translúcida -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Quest" />
    <meta name="description" content="Gestor de tareas con progresión tipo RPG: XP, niveles y rachas. Offline-first." />

    <!-- Open Graph (vista previa al compartir el enlace en redes/mensajería) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quest" />
    <meta property="og:title" content="Quest — Tareas RPG" />
    <meta property="og:description" content="Convierte tus tareas y hábitos en una aventura: gana XP, sube de nivel, encadena rachas y enfócate con Pomodoro. Funciona sin conexión." />
    <meta property="og:url" content="https://quest-task-rpg-app.vercel.app/" />
    <meta property="og:image" content="https://quest-task-rpg-app.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vista Hoy de Quest: nivel 7, racha de 12 días, tareas y hábitos del día." />
    <meta property="og:locale" content="es_ES" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quest — Tareas RPG" />
    <meta name="twitter:description" content="Convierte tus tareas y hábitos en una aventura: gana XP, sube de nivel, encadena rachas y enfócate con Pomodoro. Funciona sin conexión." />
    <meta name="twitter:image" content="https://quest-task-rpg-app.vercel.app/og-image.png" />

    <title>Quest — Tareas RPG</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
