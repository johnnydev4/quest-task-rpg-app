  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
      /* ───────────────────────── Tokens (same palette as the app) ───────────────────────── */
      :root {
        color-scheme: dark;
        --surface-900: #0d1117;
        --surface-800: #161b22;
        --surface-700: #21262d;
        --ink: #ffffff;
        --ink-dim: #cbd2dc;
        --ink-muted: #9aa3b2;
        --ink-faint: #6b7280;
        --warn: #fbbf24;
        --danger: #fb7185;
        --ok: #34d399;
        --info: #38bdf8;
        --accent-300: #c4b5fd;
        --accent-400: #a78bfa;
        --accent-500: #8b5cf6;
        --accent-600: #7c3aed;
        --accent-700: #6d28d9;
        --glass: color-mix(in srgb, var(--surface-800) 38%, var(--surface-800));
        --rainbow: linear-gradient(90deg, #ef4444, #f97316, #eab308, #22c55e, #3b82f6, #a855f7);
        --radius: 1rem;
        --max: 72rem;
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        background: var(--surface-900);
        color: var(--ink-dim);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      a { color: inherit; text-decoration: none; }
      button { font: inherit; cursor: pointer; }
      img { max-width: 100%; display: block; }
      ::selection { background: color-mix(in srgb, var(--accent-500) 45%, transparent); }

      .wrap { width: min(var(--max), 100% - 2rem); margin-inline: auto; }

      /* ───────────────────────── Glass ───────────────────────── */
      .glass {
        background: color-mix(in srgb, var(--glass) 55%, transparent);
        backdrop-filter: blur(18px) saturate(150%);
        -webkit-backdrop-filter: blur(18px) saturate(150%);
        box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }
      .glass-strong {
        background: color-mix(in srgb, var(--glass) 90%, transparent);
        backdrop-filter: blur(28px) saturate(150%);
        -webkit-backdrop-filter: blur(28px) saturate(150%);
        box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.06);
      }

      /* ───────────────────────── Background ───────────────────────── */
      .bg {
        position: fixed; inset: 0; z-index: -2; overflow: hidden;
        background: var(--surface-900);
      }
      .bg video, .bg img {
        position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
        opacity: 0.55; filter: saturate(1.1);
      }
      .bg::after {
        content: ''; position: absolute; inset: 0;
        background:
          radial-gradient(60% 50% at 70% 10%, color-mix(in srgb, var(--accent-600) 35%, transparent), transparent 70%),
          linear-gradient(180deg, color-mix(in srgb, var(--surface-900) 55%, transparent) 0%, var(--surface-900) 80%);
      }
      .orb {
        position: absolute; border-radius: 999px; filter: blur(70px); opacity: 0.45;
        animation: drift 18s ease-in-out infinite alternate;
      }
      .orb.a { width: 38vw; height: 38vw; left: -10vw; top: 10vh; background: var(--accent-600); }
      .orb.b { width: 30vw; height: 30vw; right: -8vw; top: 30vh; background: #38bdf8; animation-delay: -6s; animation-duration: 24s; }
      .orb.c { width: 24vw; height: 24vw; left: 40vw; top: 70vh; background: #ec4899; animation-delay: -12s; animation-duration: 30s; opacity: 0.25; }
      @keyframes drift {
        from { transform: translate3d(0, 0, 0) scale(1); }
        to { transform: translate3d(6vw, -6vh, 0) scale(1.15); }
      }

      /* ───────────────────────── Nav ───────────────────────── */
      .nav {
        position: sticky; top: 0; z-index: 50;
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        background: color-mix(in srgb, var(--surface-900) 55%, transparent);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .nav .wrap { display: flex; align-items: center; gap: 1rem; height: 3.75rem; }
      .logo { display: flex; align-items: center; gap: 0.6rem; font-weight: 800; color: var(--ink); font-size: 1.05rem; }
      .logo .mark {
        width: 2rem; height: 2rem; border-radius: 0.6rem;
        background: linear-gradient(135deg, #6366f1, var(--accent-500));
        display: grid; place-items: center; box-shadow: 0 8px 20px -8px var(--accent-500);
      }
      .nav-links { display: none; gap: 1.4rem; margin-left: 1rem; font-size: 0.875rem; color: var(--ink-muted); }
      .nav-links a:hover { color: var(--ink); }
      .nav .spacer { flex: 1; }
      .lang {
        display: inline-flex; padding: 0.2rem; border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.04);
      }
      .lang button {
        border: 0; background: transparent; color: var(--ink-muted);
        padding: 0.3rem 0.7rem; border-radius: 999px; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em;
        transition: background 0.2s, color 0.2s;
      }
      .lang button[aria-pressed='true'] { background: var(--accent-600); color: #fff; }

      .btn {
        display: inline-flex; align-items: center; gap: 0.5rem;
        padding: 0.7rem 1.2rem; border-radius: 0.8rem; font-weight: 600; font-size: 0.9375rem;
        border: 1px solid transparent; transition: transform 0.15s, background 0.2s, box-shadow 0.2s, border-color 0.2s;
        white-space: nowrap;
      }
      .btn:active { transform: scale(0.97); }
      .btn-primary {
        background: var(--accent-600); color: #fff;
        box-shadow: 0 10px 30px -10px var(--accent-500);
      }
      .btn-primary:hover { background: var(--accent-500); box-shadow: 0 14px 34px -10px var(--accent-400); transform: translateY(-1px); }
      .btn-ghost { border-color: rgba(255, 255, 255, 0.12); color: var(--ink-dim); background: rgba(255, 255, 255, 0.03); }
      .btn-ghost:hover { background: rgba(255, 255, 255, 0.08); color: var(--ink); }
      .btn-sm { padding: 0.5rem 0.9rem; font-size: 0.8125rem; border-radius: 0.65rem; }

      /* ───────────────────────── Hero ───────────────────────── */
      .hero { padding: 4.5rem 0 3rem; position: relative; }
      .hero .wrap { display: grid; gap: 3rem; align-items: center; }
      .eyebrow {
        display: inline-flex; align-items: center; gap: 0.5rem;
        padding: 0.35rem 0.8rem 0.35rem 0.5rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600;
        color: var(--accent-300); border: 1px solid color-mix(in srgb, var(--accent-500) 40%, transparent);
        background: color-mix(in srgb, var(--accent-500) 12%, transparent);
      }
      .eyebrow .dot { width: 0.5rem; height: 0.5rem; border-radius: 999px; background: var(--ok); box-shadow: 0 0 0 0 var(--ok); animation: pulse 2s infinite; }
      @keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ok) 60%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
      h1 {
        margin: 1.2rem 0 1rem; font-size: clamp(2.3rem, 6vw, 4rem); line-height: 1.02; letter-spacing: -0.03em;
        font-weight: 900; color: var(--ink);
      }
      h1 .grad {
        background: linear-gradient(90deg, var(--accent-300), var(--accent-500) 50%, #38bdf8);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        background-size: 200% 100%; animation: shimmer 6s linear infinite;
      }
      @keyframes shimmer { to { background-position: 200% 0; } }
      .lead { font-size: 1.125rem; line-height: 1.6; color: var(--ink-muted); max-width: 34rem; margin: 0 0 1.75rem; }
      .cta { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
      .hero-meta { display: flex; flex-wrap: wrap; gap: 1.2rem; margin-top: 1.75rem; font-size: 0.8125rem; color: var(--ink-faint); }
      .hero-meta span { display: inline-flex; align-items: center; gap: 0.4rem; }
      .hero-meta svg { width: 0.95rem; height: 0.95rem; color: var(--ok); }

      /* ───────────────────────── App mockup ───────────────────────── */
      .mock-wrap { position: relative; perspective: 1600px; }
      .mock {
        border-radius: 1.25rem; overflow: hidden; display: grid; grid-template-columns: 11.5rem 1fr;
        min-height: 26rem; font-size: 0.8125rem;
        transform: rotateY(-8deg) rotateX(4deg);
        box-shadow: 0 40px 80px -30px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.06);
        animation: floaty 7s ease-in-out infinite;
      }
      @keyframes floaty { 0%, 100% { transform: rotateY(-8deg) rotateX(4deg) translateY(0); } 50% { transform: rotateY(-8deg) rotateX(4deg) translateY(-8px); } }
      .mock-side {
        background: color-mix(in srgb, var(--surface-800) 80%, transparent);
        backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        padding: 0.9rem 0.75rem; border-right: 1px solid rgba(255, 255, 255, 0.05);
        display: flex; flex-direction: column; gap: 0.5rem;
      }
      .mock-main { position: relative; padding: 0.9rem; background: color-mix(in srgb, var(--surface-900) 45%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
      .player { border-radius: 0.8rem; padding: 0.7rem; margin-bottom: 0.5rem; }
      .player .top { display: flex; align-items: center; gap: 0.55rem; }
      .lvl {
        width: 1.9rem; height: 1.9rem; border-radius: 0.5rem; display: grid; place-items: center;
        background: linear-gradient(135deg, var(--accent-400), var(--accent-600)); color: #fff; font-weight: 800; font-size: 0.8rem;
        transition: transform 0.3s;
      }
      .lvl.bump { animation: bump 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.4); }
      @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.35) rotate(-6deg); } 100% { transform: scale(1); } }
      .player b { display: block; color: var(--ink); font-size: 0.8rem; }
      .player small { color: var(--accent-300); font-size: 0.65rem; font-weight: 600; }
      .bar { height: 0.35rem; border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; margin-top: 0.55rem; position: relative; }
      .bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent-400), var(--accent-600)); width: 12%; transition: width 0.7s cubic-bezier(0.2, 0.8, 0.2, 1); }
      .bar .flash { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.6); opacity: 0; }
      .bar .flash.on { animation: flash 1s ease-out; }
      @keyframes flash { 0% { opacity: 0.8; } 100% { opacity: 0; } }
      .player .foot { display: flex; justify-content: space-between; margin-top: 0.4rem; font-size: 0.62rem; color: var(--ink-faint); }
      .player .streak { color: var(--warn); font-weight: 600; }
      .navi { display: flex; align-items: center; gap: 0.5rem; padding: 0.45rem 0.6rem; border-radius: 0.55rem; color: var(--ink-muted); font-size: 0.75rem; }
      .navi.on { background: color-mix(in srgb, var(--accent-500) 18%, transparent); color: var(--accent-300); font-weight: 600; }
      .navi svg { width: 0.9rem; height: 0.9rem; }
      .navi .n { margin-left: auto; font-size: 0.65rem; color: var(--ink-faint); }
      .navi.on .n { color: var(--accent-300); }
      .mock-h { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.8rem; }
      .mock-h b { color: var(--ink); font-size: 1rem; }
      .mock-h small { color: var(--ink-faint); font-size: 0.65rem; display: block; }
      .mock-h svg { width: 1.3rem; height: 1.3rem; color: var(--accent-400); }
      .sec { font-size: 0.65rem; color: var(--ink-muted); font-weight: 600; margin: 0.6rem 0 0.35rem; display: flex; gap: 0.3rem; }
      .sec span { color: var(--ink-faint); font-weight: 400; }
      .task {
        display: flex; align-items: center; gap: 0.6rem; padding: 0.55rem 0.7rem; border-radius: 0.7rem;
        background: color-mix(in srgb, var(--surface-700) 85%, transparent); border: 1px solid rgba(255, 255, 255, 0.05);
        border-left: 3px solid var(--c, var(--accent-500)); margin-bottom: 0.4rem; position: relative;
        transition: opacity 0.4s, transform 0.4s;
      }
      .task.done { opacity: 0.45; }
      .task.done .t { text-decoration: line-through; }
      .chk {
        width: 1.1rem; height: 1.1rem; border-radius: 999px; border: 2px solid var(--ink-faint); flex: none; display: grid; place-items: center;
        transition: background 0.25s, border-color 0.25s;
      }
      .chk svg { width: 0.65rem; height: 0.65rem; stroke: #fff; stroke-width: 3; fill: none; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset 0.3s 0.1s; }
      .task.done .chk { background: var(--accent-500); border-color: var(--accent-500); }
      .task.done .chk svg { stroke-dashoffset: 0; }
      .task .t { color: var(--ink); font-weight: 500; font-size: 0.78rem; }
      .chips { display: flex; gap: 0.3rem; margin-top: 0.25rem; flex-wrap: wrap; }
      .chip { font-size: 0.58rem; padding: 0.1rem 0.4rem; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.1); color: var(--ink-muted); }
      .chip.hi { border-color: color-mix(in srgb, var(--danger) 40%, transparent); background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
      .chip.md { border-color: color-mix(in srgb, var(--warn) 40%, transparent); background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); }
      .xp-float {
        position: absolute; right: 0.6rem; top: -0.55rem; font-weight: 800; font-size: 0.75rem; color: var(--accent-300); opacity: 0; pointer-events: none;
        text-shadow: 0 0 10px color-mix(in srgb, var(--accent-500) 80%, transparent);
      }
      .xp-float.go { animation: xpfloat 1.3s ease-out forwards; }
      @keyframes xpfloat { 0% { opacity: 0; transform: translateY(6px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-18px); } }
      .habit {
        padding: 0.55rem 0.7rem; border-radius: 0.8rem; margin-bottom: 0.4rem;
        border: 1px solid color-mix(in srgb, var(--hc, #22c55e) 45%, transparent);
        background: linear-gradient(125deg, color-mix(in srgb, var(--hc, #22c55e) 22%, transparent), color-mix(in srgb, var(--hc, #22c55e) 8%, transparent) 70%);
        display: grid; grid-template-columns: auto 1fr; gap: 0.6rem; align-items: center;
      }
      .habit .t { color: var(--ink); font-weight: 500; font-size: 0.78rem; display: flex; justify-content: space-between; align-items: center; }
      .combo-pill { font-size: 0.55rem; font-weight: 900; letter-spacing: 0.06em; text-transform: uppercase; color: #fff; padding: 0.1rem 0.45rem; border-radius: 999px; background: var(--rainbow); opacity: 0; transform: scale(0.6); }
      .combo-pill.go { animation: combo 2.2s ease-out forwards; }
      @keyframes combo { 0% { opacity: 0; transform: scale(0.6); } 15% { opacity: 1; transform: scale(1.1); } 25% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
      .habit .bar { margin-top: 0.35rem; }
      .habit .bar > i { width: 57%; background: var(--rainbow); }
      .habit.done .bar > i { width: 71%; }
      .habit .chk.done { background: var(--hc); border-color: transparent; }
      .quick {
        margin-top: 0.8rem; display: flex; gap: 0.5rem; align-items: center;
      }
      .quick .in { flex: 1; border-radius: 0.7rem; padding: 0.55rem 0.8rem; color: var(--ink-faint); font-size: 0.75rem; border: 1px solid rgba(255, 255, 255, 0.08); background: rgba(255, 255, 255, 0.04); }
      .quick .plus { width: 2rem; height: 2rem; border-radius: 0.7rem; background: var(--accent-600); color: #fff; display: grid; place-items: center; font-weight: 700; box-shadow: 0 8px 20px -8px var(--accent-500); }
      .toast {
        position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(0.8); opacity: 0;
        border-radius: 1rem; padding: 1rem 1.4rem; text-align: center; border: 1px solid color-mix(in srgb, var(--accent-500) 40%, transparent);
        pointer-events: none;
      }
      .toast.go { animation: toast 2.6s cubic-bezier(0.2, 0.9, 0.3, 1.15) forwards; }
      @keyframes toast { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.7); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(0.9); } }
      .toast .big { width: 2.6rem; height: 2.6rem; margin: 0 auto 0.5rem; border-radius: 0.8rem; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent-400), var(--accent-600)); color: #fff; font-weight: 900; font-size: 1.1rem; box-shadow: 0 10px 30px -8px var(--accent-500); }
      .toast b { color: var(--ink); font-size: 1rem; display: block; }
      .toast small { color: var(--accent-300); font-weight: 600; font-size: 0.7rem; }
      .gem {
        position: absolute; width: 5.5rem; right: -1.5rem; top: -2.5rem; filter: drop-shadow(0 10px 30px color-mix(in srgb, var(--accent-500) 70%, transparent));
        animation: gem 5s ease-in-out infinite;
      }
      @keyframes gem { 0%, 100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-14px) rotate(6deg); } }

      /* ───────────────────────── Sections ───────────────────────── */
      section { padding: 4.5rem 0; }
      .section-h { max-width: 40rem; margin-bottom: 2.5rem; }
      .kicker { color: var(--accent-400); font-weight: 700; font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase; }
      h2 { color: var(--ink); font-size: clamp(1.7rem, 3.5vw, 2.5rem); letter-spacing: -0.02em; margin: 0.6rem 0 0.8rem; font-weight: 800; line-height: 1.1; }
      .section-h p { color: var(--ink-muted); font-size: 1.05rem; line-height: 1.6; margin: 0; }

      .trio { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); }
      .pill-card { padding: 1.2rem 1.3rem; border-radius: var(--radius); display: flex; gap: 0.9rem; align-items: flex-start; }
      .pill-card .ic { width: 2.5rem; height: 2.5rem; flex: none; border-radius: 0.75rem; display: grid; place-items: center; background: color-mix(in srgb, var(--accent-500) 18%, transparent); color: var(--accent-300); }
      .pill-card .ic svg { width: 1.25rem; height: 1.25rem; }
      .pill-card b { color: var(--ink); display: block; margin-bottom: 0.2rem; }
      .pill-card p { margin: 0; font-size: 0.875rem; color: var(--ink-muted); line-height: 1.5; }

      /* Bento */
      .bento { display: grid; gap: 1rem; grid-template-columns: repeat(6, 1fr); }
      .card { border-radius: 1.25rem; padding: 1.4rem; display: flex; flex-direction: column; gap: 1rem; grid-column: span 6; min-height: 16rem; overflow: hidden; position: relative; }
      .card h3 { margin: 0; color: var(--ink); font-size: 1.1rem; font-weight: 700; }
      .card p { margin: 0.3rem 0 0; color: var(--ink-muted); font-size: 0.9rem; line-height: 1.5; }
      .card .demo { margin-top: auto; }
      .tag { font-size: 0.7rem; font-weight: 700; color: var(--accent-300); text-transform: uppercase; letter-spacing: 0.08em; display: flex; align-items: center; gap: 0.4rem; }
      .tag svg { width: 0.9rem; height: 0.9rem; }

      /* Quick add demo */
      .qa { border-radius: 0.9rem; padding: 0.8rem 1rem; font-size: 0.9rem; color: var(--ink); border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0, 0, 0, 0.25); min-height: 2.9rem; display: flex; align-items: center; }
      .qa .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--accent-300); margin-left: 2px; animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .qa-chips { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.6rem; min-height: 1.6rem; }
      .qa-chips span { font-size: 0.72rem; padding: 0.25rem 0.6rem; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--accent-500) 40%, transparent); background: color-mix(in srgb, var(--accent-500) 12%, transparent); color: var(--accent-300); opacity: 0; transform: translateY(6px); animation: chipin 0.4s forwards; }
      @keyframes chipin { to { opacity: 1; transform: none; } }

      /* Combo demo */
      .combo-row { display: flex; gap: 0.4rem; align-items: center; margin-bottom: 0.8rem; }
      .combo-row i { width: 1.6rem; height: 1.6rem; border-radius: 999px; display: grid; place-items: center; font-style: normal; font-size: 0.65rem; font-weight: 800; color: #fff; background: rgba(255, 255, 255, 0.08); transition: transform 0.3s, background 0.3s, box-shadow 0.3s; }
      .combo-row i.on { background: var(--cc); box-shadow: 0 0 18px -2px var(--cc); transform: scale(1.12); }
      .combo-row i.on.rb { background: var(--rainbow); }
      .combo-row .mult { margin-left: auto; font-weight: 800; color: var(--ink); font-size: 1.1rem; }
      .combo-row .mult small { color: var(--ink-faint); font-weight: 500; font-size: 0.7rem; }
      .combo-bar { height: 0.5rem; border-radius: 999px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
      .combo-bar i { display: block; height: 100%; width: 0; background: var(--rainbow); transition: width 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); border-radius: 999px; }

      /* Pomodoro demo */
      .pomo { display: flex; align-items: center; gap: 1.2rem; }
      .ring { width: 7.5rem; height: 7.5rem; position: relative; flex: none; }
      .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
      .ring circle { fill: none; stroke-width: 7; stroke-linecap: round; }
      .ring .track { stroke: rgba(255, 255, 255, 0.08); }
      .ring .prog { stroke: var(--accent-500); stroke-dasharray: 326.7; stroke-dashoffset: 326.7; transition: stroke-dashoffset 1s linear; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent-500) 70%, transparent)); }
      .ring .time { position: absolute; inset: 0; display: grid; place-items: center; font-variant-numeric: tabular-nums; font-weight: 800; color: var(--ink); font-size: 1.25rem; }
      .pomo-side { display: flex; flex-direction: column; gap: 0.5rem; font-size: 0.8rem; color: var(--ink-muted); }
      .pomo-side .ph { display: inline-flex; width: fit-content; padding: 0.2rem 0.7rem; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--accent-500) 40%, transparent); background: color-mix(in srgb, var(--accent-500) 12%, transparent); color: var(--accent-300); font-weight: 600; font-size: 0.72rem; }
      .pomo-side .amb { display: flex; gap: 0.3rem; flex-wrap: wrap; }
      .pomo-side .amb span { font-size: 0.65rem; padding: 0.2rem 0.55rem; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.1); }
      .pomo-side .amb span.on { border-color: color-mix(in srgb, var(--accent-500) 50%, transparent); color: var(--accent-300); background: color-mix(in srgb, var(--accent-500) 12%, transparent); }

      /* Stats demo */
      .chart { display: flex; align-items: flex-end; gap: 0.45rem; height: 5.5rem; }
      .chart i { flex: 1; border-radius: 0.35rem 0.35rem 0.15rem 0.15rem; background: linear-gradient(180deg, var(--accent-400), var(--accent-700)); height: 0; transition: height 0.9s cubic-bezier(0.2, 0.8, 0.2, 1); transition-delay: calc(var(--i) * 70ms); }
      .in .chart i { height: var(--h); }
      .heat { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; margin-top: 0.9rem; }
      .heat i { aspect-ratio: 1; border-radius: 2px; background: rgba(255, 255, 255, 0.06); opacity: 0; transition: opacity 0.4s; transition-delay: calc(var(--i) * 12ms); }
      .in .heat i { opacity: 1; }
      .heat i[data-l='1'] { background: color-mix(in srgb, var(--accent-500) 30%, transparent); }
      .heat i[data-l='2'] { background: color-mix(in srgb, var(--accent-500) 55%, transparent); }
      .heat i[data-l='3'] { background: var(--accent-500); }
      .heat i[data-l='4'] { background: var(--accent-300); }
      .streaks { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.8rem; }
      .streaks span { font-size: 0.7rem; padding: 0.2rem 0.6rem; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); font-weight: 600; }

      /* Theme demo */
      .swatches { display: flex; gap: 0.6rem; flex-wrap: wrap; }
      .swatches button { width: 2.2rem; height: 2.2rem; border-radius: 999px; border: 2px solid transparent; background: var(--sw); transition: transform 0.2s, border-color 0.2s; }
      .swatches button:hover { transform: scale(1.1); }
      .swatches button[aria-pressed='true'] { border-color: #fff; transform: scale(1.12); }
      .theme-prev { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 0.9rem; }
      .theme-prev div { border-radius: 0.7rem; padding: 0.7rem; font-size: 0.7rem; }
      .theme-prev .dark { background: #161b22; color: #cbd2dc; border: 1px solid rgba(255,255,255,0.08); }
      .theme-prev .light { background: #fff; color: #334155; }
      .theme-prev b { display: block; margin-bottom: 0.4rem; }
      .theme-prev .dark b { color: #fff; }
      .theme-prev .light b { color: #0b1220; }
      .theme-prev .mini { height: 0.35rem; border-radius: 999px; background: linear-gradient(90deg, var(--accent-400), var(--accent-600)); width: 70%; }

      /* Calendar demo */
      .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.25rem; font-size: 0.65rem; text-align: center; }
      .cal span { padding: 0.35rem 0; border-radius: 0.4rem; color: var(--ink-muted); position: relative; }
      .cal span.h { color: var(--ink-faint); font-weight: 700; font-size: 0.55rem; }
      .cal span.today { background: var(--accent-600); color: #fff; font-weight: 700; }
      .cal span.d::after { content: ''; position: absolute; left: 50%; bottom: 2px; width: 4px; height: 4px; border-radius: 999px; background: var(--dc, var(--accent-400)); transform: translateX(-50%); }

      /* Ideas demo */
      .tree svg { width: 100%; height: auto; }
      .tree .edge { stroke: color-mix(in srgb, var(--accent-500) 60%, transparent); stroke-width: 2; fill: none; stroke-dasharray: 200; stroke-dashoffset: 200; }
      .in .tree .edge { animation: draw 0.9s ease-out forwards; animation-delay: calc(var(--i) * 0.15s); }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .tree .node { opacity: 0; transform: scale(0.8); transform-box: fill-box; transform-origin: center; }
      .in .tree .node { animation: nodein 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.3) forwards; animation-delay: calc(var(--i) * 0.15s + 0.2s); }
      @keyframes nodein { to { opacity: 1; transform: scale(1); } }
      .tree rect { fill: #21262d; stroke: rgba(255, 255, 255, 0.1); }
      .tree rect.root { fill: color-mix(in srgb, var(--accent-500) 25%, #21262d); stroke: var(--accent-500); }
      .tree text { fill: #cbd2dc; font-size: 11px; font-weight: 600; }

      /* Steps */
      .steps { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); counter-reset: s; }
      .step { padding: 1.5rem; border-radius: var(--radius); position: relative; }
      .step .num { width: 2.2rem; height: 2.2rem; border-radius: 0.7rem; display: grid; place-items: center; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--accent-400), var(--accent-600)); margin-bottom: 1rem; box-shadow: 0 8px 20px -8px var(--accent-500); }
      .step b { color: var(--ink); display: block; font-size: 1.05rem; margin-bottom: 0.3rem; }
      .step p { margin: 0; color: var(--ink-muted); font-size: 0.9rem; line-height: 1.5; }

      /* Titles ladder */
      .ladder { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center; margin-top: 2rem; }
      .ladder span { padding: 0.4rem 0.8rem; border-radius: 999px; font-size: 0.78rem; font-weight: 600; border: 1px solid rgba(255, 255, 255, 0.1); color: var(--ink-muted); background: rgba(255, 255, 255, 0.03); transition: color 0.3s, border-color 0.3s, background 0.3s; }
      .ladder span small { color: var(--ink-faint); font-weight: 500; margin-left: 0.3rem; }
      .ladder span.lit { color: var(--accent-300); border-color: color-mix(in srgb, var(--accent-500) 50%, transparent); background: color-mix(in srgb, var(--accent-500) 12%, transparent); }

      /* Final CTA */
      .final { text-align: center; padding: 3.5rem 1.5rem; border-radius: 1.5rem; position: relative; overflow: hidden; }
      .final::before { content: ''; position: absolute; inset: -40%; background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--accent-500) 35%, transparent), transparent 55%); animation: drift 14s ease-in-out infinite alternate; }
      .final > * { position: relative; }
      .final h2 { margin-top: 0; }
      .final .cta { justify-content: center; margin-top: 1.5rem; }

      footer { padding: 2.5rem 0 3.5rem; color: var(--ink-faint); font-size: 0.8125rem; border-top: 1px solid rgba(255, 255, 255, 0.05); }
      footer .wrap { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between; }
      footer a { color: var(--ink-muted); }
      footer a:hover { color: var(--ink); }
      footer .links { display: flex; gap: 1.2rem; flex-wrap: wrap; }

      /* Reveal */
      .reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.7s ease, transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1); }
      .reveal.in { opacity: 1; transform: none; }
      .reveal[data-d='1'] { transition-delay: 0.1s; }
      .reveal[data-d='2'] { transition-delay: 0.2s; }
      .reveal[data-d='3'] { transition-delay: 0.3s; }

      @media (min-width: 640px) {
        .card { grid-column: span 3; }
      }
      @media (min-width: 900px) {
        .nav-links { display: flex; }
        .hero { padding: 6rem 0 4rem; }
        .hero .wrap { grid-template-columns: 1.05fr 1fr; }
        .card { grid-column: span 2; }
        .card.wide { grid-column: span 4; }
        .card.tall { grid-column: span 2; }
      }
      @media (max-width: 640px) {
        .mock { grid-template-columns: 1fr; transform: none; animation: none; min-height: 0; }
        .mock-side { display: none; }
        .gem { width: 4rem; right: -0.5rem; top: -1.5rem; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        .reveal { opacity: 1; transform: none; }
        .mock { transform: none; }
      }
    </style>

        restartQuickAdd()
      }
      document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => applyLang(b.dataset.lang)))

      // ───────────────────────── Reveal on scroll ─────────────────────────
      const io = new IntersectionObserver((entries) => {
        for (const e of entries) if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) }
      }, { threshold: 0.15 })
      document.querySelectorAll('.reveal').forEach((el) => io.observe(el))

      // ───────────────────────── Hero mockup loop ─────────────────────────
      const $ = (id) => document.getElementById(id)
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches
      function mockLoop() {
        const t1 = $('m-t1'), t2 = $('m-t2'), h = $('m-h'), xp = $('m-xp'), flash = $('m-flash')
        const steps = [
          [900, () => { t1.classList.add('done'); go($('m-f1')); xp.style.width = '34%'; flashIt(); setPending(2) }],
          [2300, () => { h.classList.add('done'); $('m-hchk').classList.add('done'); go($('m-combo')); xp.style.width = '58%'; flashIt() }],
          [3900, () => { t2.classList.add('done'); go($('m-f2')); xp.style.width = '100%'; flashIt(); setPending(1) }],
          [4800, () => { go($('m-toast')); $('m-lvl').textContent = '8'; $('m-lvl2').textContent = '8'; $('m-lvl').classList.add('bump'); $('m-title').textContent = I18N[lang]['mock.t8']; $('m-xpnum').textContent = '40/2210 XP'; xp.style.transition = 'none'; xp.style.width = '2%'; setTimeout(() => { xp.style.transition = ''; xp.style.width = '8%' }, 50) }],
          [8200, () => { for (const el of [t1, t2, h]) el.classList.remove('done'); $('m-hchk').classList.remove('done'); $('m-lvl').classList.remove('bump'); $('m-lvl').textContent = '7'; $('m-lvl2').textContent = '7'; $('m-title').textContent = I18N[lang]['mock.t7']; $('m-xpnum').textContent = '220/1852 XP'; xp.style.width = '12%'; setPending(3) }],
        ]
        function go(el) { el.classList.remove('go'); void el.offsetWidth; el.classList.add('go') }
        function flashIt() { flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on') }
        function setPending(n) { $('m-pending').textContent = n; $('m-pending2').textContent = n }
        for (const [t, fn] of steps) setTimeout(fn, t)
        setTimeout(mockLoop, 9400)
      }
      if (!reduced) mockLoop()
      else { $('m-t1').classList.add('done'); $('m-xp').style.width = '46%' }

      // ───────────────────────── Quick-add typing demo ─────────────────────────
      const QA = {
        en: [
          ['Gym on monday at 8pm every week #health', ['📅 Mon, Nov 16', '⏰ 20:00', '🔁 Every week', '#health']],
          ['Pay rent on the 1st !high', ['📅 Dec 1', '⚡ High']],
          ['Call mom tomorrow at 5:30pm', ['📅 Tomorrow', '⏰ 17:30']],
        ],
        es: [
          ['Gimnasio el lunes a las 8pm cada semana #salud', ['📅 lun, 16 nov', '⏰ 20:00', '🔁 Cada semana', '#salud']],
          ['Pagar el alquiler el 1 !alta', ['📅 1 dic', '⚡ Alta']],
          ['Llamar a mamá mañana a las 17:30', ['📅 Mañana', '⏰ 17:30']],
        ],
      }
      let qaTimer = null, qaIdx = 0
      function restartQuickAdd() {
        clearTimeout(qaTimer)
        const text = $('qa-text'), chips = $('qa-chips')
        const [phrase, out] = QA[lang][qaIdx % QA[lang].length]
        qaIdx++
        text.textContent = ''
        chips.innerHTML = ''
        if (reduced) { text.textContent = phrase; chips.innerHTML = out.map((c) => `<span>${c}</span>`).join(''); return }
        let i = 0
        const type = () => {
          text.textContent = phrase.slice(0, ++i)
          if (i < phrase.length) qaTimer = setTimeout(type, 38 + Math.random() * 40)
          else {
            qaTimer = setTimeout(() => {
              chips.innerHTML = out.map((c, k) => `<span style="animation-delay:${k * 90}ms">${c}</span>`).join('')
              qaTimer = setTimeout(restartQuickAdd, 3800)
            }, 350)
          }
        }
        qaTimer = setTimeout(type, 600)
      }

      // ───────────────────────── Combo demo ─────────────────────────
      const comboDots = [...document.querySelectorAll('#combo-row i')]
      const mults = ['×1', '×1.5', '×2', '×2.5', '×3', '×3.5', '×4']
      let combo = 0
      setInterval(() => {
        combo = (combo + 1) % 9
        const n = Math.min(combo, 7)
        comboDots.forEach((d, i) => d.classList.toggle('on', i < n))
        $('combo-mult').textContent = mults[Math.max(0, n - 1)]
        $('combo-bar').style.width = `${(n / 7) * 100}%`
      }, 900)

      // ───────────────────────── Pomodoro demo ─────────────────────────
      const TOTAL = 25 * 60
      let left = TOTAL - 37
      const C = 2 * Math.PI * 52
      function tickRing() {
        left = left <= 0 ? TOTAL : left - 1
        const m = String(Math.floor(left / 60)).padStart(2, '0'), s = String(left % 60).padStart(2, '0')
        $('ring-time').textContent = `${m}:${s}`
        $('ring').style.strokeDashoffset = String(C * (left / TOTAL))
      }
      tickRing()
      setInterval(tickRing, 1000)

      // ───────────────────────── Heatmap ─────────────────────────
      const heat = $('heat')
      const levels = '0120313243210421313432120324131242031421340231412033142'
      for (let i = 0; i < 140; i++) {
        const el = document.createElement('i')
        el.style.setProperty('--i', i)
        el.dataset.l = levels[(i * 7) % levels.length]
        heat.appendChild(el)
      }

      // ───────────────────────── Calendar ─────────────────────────
      function buildCal() {
        const cal = $('cal')
        cal.innerHTML = ''
        const heads = lang === 'es' ? ['L', 'M', 'X', 'J', 'V', 'S', 'D'] : ['M', 'T', 'W', 'T', 'F', 'S', 'S']
        heads.forEach((h) => { const s = document.createElement('span'); s.className = 'h'; s.textContent = h; cal.appendChild(s) })
        const dots = { 3: '#6366f1', 5: '#f43f5e', 9: '#10b981', 12: '#f59e0b', 14: '#8b5cf6', 18: '#6366f1', 21: '#f43f5e', 26: '#14b8a6' }
        for (let i = 0; i < 2; i++) cal.appendChild(document.createElement('span'))
        for (let d = 1; d <= 30; d++) {
          const s = document.createElement('span'); s.textContent = d
          if (d === 10) s.classList.add('today')
          if (dots[d]) { s.classList.add('d'); s.style.setProperty('--dc', dots[d]) }
          cal.appendChild(s)
        }
      }
      buildCal()
      document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', buildCal))

      // ───────────────────────── Theme swatches ─────────────────────────
      document.querySelectorAll('#swatches button').forEach((b) => b.addEventListener('click', () => {
        const [a300, a400, a500, a600, a700] = b.dataset.a.split(',')
        const r = document.documentElement.style
        r.setProperty('--accent-300', a300); r.setProperty('--accent-400', a400); r.setProperty('--accent-500', a500); r.setProperty('--accent-600', a600); r.setProperty('--accent-700', a700)
        document.querySelectorAll('#swatches button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
      }))

      // ───────────────────────── Titles ladder ─────────────────────────
      const ladder = [...document.querySelectorAll('#ladder > span')]
      let lit = 0
      setInterval(() => {
        lit = (lit + 1) % (ladder.length + 2)
        ladder.forEach((s, i) => s.classList.toggle('lit', i < lit))
      }, 650)

      applyLang(lang)
    </script>
  </body>
</html>
